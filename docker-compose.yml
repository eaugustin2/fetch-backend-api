version: "3.9"

services:
  web:
    container_name: nextjs-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app # Mount source code
      - /app/node_modules # Prevent overwrite of node_modules
    environment:
      - NODE_ENV=development
